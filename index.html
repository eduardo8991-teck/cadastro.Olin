<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Alunos</title>
<meta name="color-scheme" content="light dark">

<!-- Aplica o tema salvo antes de desenhar a página (evita "piscar" ao carregar) -->
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("tema_cadastro"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <span class="marca-sinal" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
      </span>
      <h1>Cadastro de Alunos</h1>
    </div>

    <div class="topo-dir">
      <dl class="stats">
        <div><dd id="stat-total">0</dd><dt>alunos</dt></div>
        <div><dd id="stat-cursos">0</dd><dt>turmas</dt></div>
      </dl>
      <button type="button" id="tema" class="icone" aria-label="Alternar entre modo claro e escuro" title="Alternar tema">
        <svg class="i-lua" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="card" id="form-card" aria-labelledby="form-titulo">
    <div class="card-topo">
      <h2 id="form-titulo">Novo aluno</h2>
      <span id="form-badge" class="badge" hidden>Editando</span>
    </div>

    <form id="form" novalidate autocomplete="off">
      <div class="form-grid">

        <div class="foto">
          <div class="avatar-grande" id="avatar-grande">
            <img id="preview" alt="Foto do aluno" hidden>
            <span id="preview-vazio">Sem foto</span>
          </div>
          <div class="foto-acoes">
            <button type="button" class="btn sec" id="btn-foto">Escolher foto</button>
            <button type="button" class="btn texto" id="btn-remover-foto" hidden>Remover</button>
          </div>
          <input id="arquivo" type="file" accept="image/*" hidden>
        </div>

        <div class="campos">
          <div class="campo">
            <label for="nome">Nome *</label>
            <input id="nome" autocomplete="off">
            <small class="erro-txt"></small>
          </div>
          <div class="campo">
            <label for="email">Email *</label>
            <input id="email" type="email" inputmode="email">
            <small class="erro-txt"></small>
          </div>
          <div class="campo">
            <label for="telefone">Telefone *</label>
            <input id="telefone" inputmode="tel" placeholder="(00) 00000-0000">
            <small class="erro-txt"></small>
          </div>
          <div class="campo">
            <label for="cpf">CPF *</label>
            <input id="cpf" inputmode="numeric" placeholder="000.000.000-00">
            <small class="erro-txt"></small>
          </div>
          <div class="campo">
            <label for="data">Data de nascimento *</label>
            <input id="data" type="date">
            <small class="erro-txt"></small>
          </div>
          <div class="campo">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="">Selecione</option>
              <option>Masculino</option>
              <option>Feminino</option>
              <option>Outro</option>
            </select>
            <small class="erro-txt"></small>
          </div>
          <div class="campo larga">
            <label for="curso">Curso *</label>
            <input id="curso" list="cursos" placeholder="Escolha ou digite">
            <datalist id="cursos"></datalist>
            <small class="erro-txt"></small>
          </div>
        </div>
      </div>

      <div class="acoes">
        <button type="button" class="btn sec" id="btn-novo">Novo aluno</button>
        <button type="submit" class="btn prim" id="btn-salvar">Cadastrar aluno</button>
        <button type="button" class="btn perigo" id="btn-excluir" disabled>Excluir</button>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="tabela-titulo">
    <div class="card-topo">
      <h2 id="tabela-titulo">Alunos cadastrados</h2>
      <span class="contagem" id="contagem" aria-live="polite"></span>
    </div>

    <div class="filtros">
      <div class="busca-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar por nome, email, CPF, telefone ou curso" aria-label="Buscar aluno">
      </div>
      <select id="filtro-curso" aria-label="Filtrar por curso">
        <option value="">Todos os cursos</option>
      </select>
      <button type="button" class="btn sec" id="btn-limpar-filtros">Limpar filtros</button>
      <button type="button" class="btn sec" id="btn-csv">Exportar CSV</button>
    </div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="id">Id</button></th>
            <th scope="col">Foto</th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="nome">Nome</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="email">Email</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="telefone">Telefone</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="sexo">Sexo</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="data">Nascimento</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="cpf">CPF</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="ord" data-campo="curso">Curso</button></th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>

    <div id="vazio" class="vazio" hidden></div>
  </section>
</main>

<div id="msg" class="toast" role="status" aria-live="polite"></div>

<dialog id="confirma" aria-labelledby="confirma-titulo">
  <form method="dialog">
    <h3 id="confirma-titulo">Excluir aluno?</h3>
    <p id="confirma-texto"></p>
    <div class="dialog-acoes">
      <button class="btn sec" value="nao">Cancelar</button>
      <button class="btn perigo-solido" value="sim">Excluir</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
